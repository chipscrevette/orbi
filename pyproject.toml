[project]
name = "orbi"
version = "0.2.0"
description = "Orbi : l'assistant d'urbanisme qui lit le PLU, vérifie chaque citation, compare les chiffres et décide — 100 % local."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "psutil>=7.2.2",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.scripts]
orbi-banc = "orbi.evaluation.notation:main"
orbi-serveur = "orbi.api.serveur:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]
bancs = ["shapely>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: demande les services locaux (serveur d'embeddings) et le cache des API publiques"]
addopts = "-m 'not integration' -q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["orbi"]
omit = ["*/evaluation/pages/*"]
